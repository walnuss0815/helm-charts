name: Auto Version Helm Charts

on: pull_request

permissions: {}

jobs:
  list-changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-charts: ${{ steps.list-changed.outputs.changed-charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          charts_json=$(echo "${changed#"charts/"}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map(split("/")[-1])')
          echo "changed-charts=$charts_json" >> "$GITHUB_OUTPUT"

  version-charts:
    needs: list-changed
    if: ${{ needs.list-changed.outputs.changed-charts != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        chart: ${{ fromJson(needs.list-changed.outputs.changed-charts) }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ACTIONS_TOKEN }}

      - name: Compute next version for ${{ matrix.chart }}
        id: semver
        uses: paulhatch/semantic-version@v6.0.1
        with:
          tag_prefix: "${{ matrix.chart }}-"
          change_path: "charts/${{ matrix.chart }}"
          major_pattern: "/(BREAKING CHANGE|!:)/"
          minor_pattern: "/^feat/"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Update Chart.yaml
        if: steps.semver.outputs.changed == 'true'
        run: |
          sed -i "s/^version:.*/version: ${{ steps.semver.outputs.version }}/" \
            charts/${{ matrix.chart }}/Chart.yaml

      - name: Commit version bump
        if: steps.semver.outputs.changed == 'true'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add charts/${{ matrix.chart }}/Chart.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit, skipping."
          else
            git commit -m "chore(${{ matrix.chart }}): bump version to ${{ steps.semver.outputs.version }}"
            git push
          fi

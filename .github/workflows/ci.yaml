name: CI

on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  list-changed:
    name: List changed Helm Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-charts: ${{ steps.list-changed.outputs.changed-charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Test release scripts
        run: bash .github/scripts/bump-versions.test.sh

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          # The PR base, so a stacked PR lists only its own charts
          changed=$(ct list-changed --config ct.yaml --target-branch "$GITHUB_BASE_REF")
          charts_json=$(echo "${changed#"charts/"}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map(split("/")[-1])')
          echo "changed-charts=$charts_json" >> "$GITHUB_OUTPUT"

  update-docs:
    name: Update Helm documentation
    needs: list-changed
    # Forks get no secrets, so the push to the PR branch cannot work there
    if: ${{ needs.list-changed.outputs.changed-charts != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # A push with GITHUB_TOKEN would not run CI for the new commit
          token: ${{ secrets.ACTIONS_TOKEN }}

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@v2
        with:
          chart-search-root: charts
          version: v1.14.2

      # Stages only the changed charts, like the release workflow
      - name: Commit and push
        env:
          CHARTS: ${{ needs.list-changed.outputs.changed-charts }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -r '.[] | "charts/\(.)/README.md"' <<<"$CHARTS" | xargs -r git add --
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping."
            exit 0
          fi
          git commit -m "docs: update Helm documentation"
          git push

  lint-test:
    name: Test and lint Helm Charts
    needs: list-changed
    if: ${{ needs.list-changed.outputs.changed-charts != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        chart: ${{ fromJson(needs.list-changed.outputs.changed-charts) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --target-branch "$GITHUB_BASE_REF" --charts charts/${{ matrix.chart }}

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2

      - name: Install dependencies
        if: ${{ matrix.chart == 'immich' || matrix.chart == 'keycloak' }}
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo update
          helm install cnpg cnpg/cloudnative-pg --namespace cnpg-system --create-namespace
          kubectl wait --for=condition=Available --timeout=180s -n cnpg-system deploy/cnpg-cloudnative-pg

      - name: Run chart-testing (install)
        run: ct install --config ct.yaml --target-branch "$GITHUB_BASE_REF" --charts charts/${{ matrix.chart }}

  check:
    name: Check CI status
    # Also runs in cancelled runs: a red check on a superseded commit is expected
    if: always()
    needs:
      - list-changed
      - update-docs
      - lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: update-docs,lint-test
          jobs: ${{ toJSON(needs) }}

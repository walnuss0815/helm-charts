apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chisel.fullname" . }}
  labels:
    {{- include "chisel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chisel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chisel.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chisel.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - client
            {{- with .Values.server.fingerprint }}
            - {{ printf "--fingerprint=%s" . | quote }}
            {{- end }}
            - $(CHISEL_SERVER_HOST):$(CHISEL_SERVER_PORT)
            {{- if not .Values.rules }}
            {{- fail "rules is required: set at least one reverse port-forwarding rule" }}
            {{- end }}
            {{- range .Values.rules }}
            - 'R:{{ .local.interface | default "0.0.0.0" }}:{{ .local.port }}:{{ .remote.host }}:{{ .remote.port }}/{{ .protocol | default "tcp" }}'
            {{- end }}
          env:
            - name: CHISEL_SERVER_HOST
              value: {{ required "server.host is required: set it to the address of the chisel server" .Values.server.host | quote }}
            - name: CHISEL_SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: AUTH
              {{- include "chisel.secretEnvVar" .Values.server.auth | indent 14 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

# Default values for chisel.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the Chisel deployment
# @default -- `1`
replicaCount: 1


# -- Container image configuration
image:
  # -- Container image repository
  repository: jpillora/chisel
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "1.11.5"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context configuration
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context configuration
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Resource limits and requests for the Chisel container
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration (disabled by default)
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
livenessProbe: {}

# -- Readiness probe configuration (disabled by default)
# readinessProbe:
#   httpGet:
#     path: /
#     port: http
readinessProbe: {}

# -- Additional volumes to mount on the Deployment
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volume mounts on the Deployment
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Remote Chisel server connection configuration
server:
  # -- IP address or domain name of a remote server running Chisel
  host: ""
  # -- Port Chisel is using on the remote server
  port: 8000
  # -- Authentication string for the Chisel remote server
  auth:
    # -- Plain-text auth value (takes precedence if set)
    value: ""
    # -- Reference to a Kubernetes Secret key containing the auth value
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

# -- Chisel reverse port-forwarding rules. Each rule maps a port on the remote Chisel server to a host/port inside the cluster.
# Example:
# ```yaml
# rules:
#   - local:
#       interface: 0.0.0.0
#       port: 80
#     remote:
#       host: traefik-external.traefik-external.svc.cluster.local
#       port: 80
# ```
rules: []
  # - local:
  #     port: 80
  #   remote:
  #     host: example
  #     port: 80
  # - local:
  #     port: 443
  #   remote:
  #     host: example
  #     port: 443

# Default values for chisel.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replica pods to run. See [ReplicaSet docs](https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/)
replicaCount: 1

# -- Container image configuration. See [Images docs](https://kubernetes.io/docs/concepts/containers/images/)
image:
  # -- Image repository for the Chisel container
  repository: jpillora/chisel
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- List of image pull secrets for pulling from private registries. See [docs](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/)
imagePullSecrets: []
# -- Overrides the chart name used in resource names
nameOverride: ""
# -- Overrides the full resource name
fullnameOverride: ""

# -- Service account configuration. See [docs](https://kubernetes.io/docs/concepts/security/service-accounts/)
serviceAccount:
  # -- Whether to create a service account
  create: true
  # -- Automatically mount the ServiceAccount API credentials into the pod. The Chisel client does not need access to the Kubernetes API
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use. If empty and `create` is true, a name is generated from the fullname template
  name: ""

# -- Annotations to add to the pod. See [docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/)
podAnnotations: {}
# -- Labels to add to the pod. See [docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)
podLabels: {}

# -- Pod-level security context. The image runs as root; the chart runs it as UID 65532 instead. Helm merges maps: set a key to `null` to remove it, or the whole value to `null`
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. The client only opens network connections and writes no files, so the root filesystem is read-only
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

# -- CPU/memory resource requests and limits. Raise the limit for many concurrent tunnelled connections. Set `limits` to `null` to remove the memory limit
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# -- Liveness probe configuration. See [docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
livenessProbe: {}
# -- Readiness probe configuration. See [docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
readinessProbe: {}

# -- Additional volumes to mount on the Deployment
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volume mounts on the Deployment
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Remote Chisel server connection configuration
server:
  # -- IP address or domain name of a remote server running Chisel. Required
  host: ""
  # -- Port Chisel is using on the remote server
  port: 8000
  # -- Fingerprint of the server's public key (44 characters, ends with `=`),
  # passed as `--fingerprint`. Strongly recommended: if empty, the client
  # accepts any server
  fingerprint: ""
  # -- Authentication string for the Chisel remote server
  auth:
    # -- Plain-text auth value in the form `<user>:<pass>`. Ignored if
    # `secretKeyRef.name` and `secretKeyRef.key` are set
    value: ""
    # -- Reference to a Kubernetes Secret key containing the auth value
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

# -- Reverse port-forwarding rules, at least one required. Each maps a port
# on the chisel server to a host and port in the cluster, e.g.
# `{local: {port: 80}, remote: {host: traefik.traefik.svc, port: 80}}`.
# `local.interface` defaults to `0.0.0.0`, `protocol` to `tcp`
rules: []
  # - local:
  #     port: 80
  #   remote:
  #     host: example
  #     port: 80
  # - local:
  #     port: 443
  #   remote:
  #     host: example
  #     port: 443

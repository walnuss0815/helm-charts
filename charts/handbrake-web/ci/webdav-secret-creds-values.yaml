persistence:
  video:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce

webdav:
  user:
    username:
      secretKeyRef:
        name: "handbrake-webdav-creds"
        key: "username"
    password:
      secretKeyRef:
        name: "handbrake-webdav-creds"
        key: "password"

extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: "handbrake-webdav-creds"
    stringData:
      username: "my-user"
      password: "my-password"

{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "handbrake-web.fullname" . -}}
{{- $svcPort := .Values.server.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "handbrake-web.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- /*
    All rule fields except backendRefs (e.g. matches, filters, timeouts)
    are passed through so newer Gateway API fields work without changes.
    */}}
    - backendRefs:
        - name: {{ $fullName }}-server
          port: {{ $svcPort }}
          weight: 1
      {{- with omit . "backendRefs" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
{{- end }}

immich:
  url: "http://immich.example.com"
  apiKey:
    value: "my-api-key"

config:
  custom_css_class: $MY_VAR

env:
  MY_VAR: this_is_my_css_class

extraManifests:
  # Test pod to verify the variable has been subsituted
  - |
    apiVersion: v1
    kind: Pod
    metadata:
      name: "{{ include "immich-kiosk.fullname" . }}-test-config"
      labels:
        {{- include "immich-kiosk.labels" . | nindent 4 }}
      annotations:
        "helm.sh/hook": test
    spec:
      containers:
        - name: test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - /bin/sh
            - -c
            - |
              curl -sf http://{{ include "immich-kiosk.fullname" . }}:{{ .Values.service.port }}/config \
              | grep -q 'custom_css_class: this_is_my_css_class' \
              && echo "OK: custom_css_class is set correctly" \
              || { echo "FAIL: custom_css_class does not have the expected value"; exit 1; }
      restartPolicy: Never

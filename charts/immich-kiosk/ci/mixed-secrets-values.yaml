immich:
  url: "http://immich.example.com"
  apiKey:
    value: "immich-test-key"
password:
  secretKeyRef:
    name: external-kiosk-password
    key: pwd
weather:
  apiKey:
    value: "weather-test-key"
config:
  weather:
    locations:
      - name: london
        lat: 51.5285262
        lon: -0.2663999
        api: ""
        unit: metric
        lang: en
extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: external-kiosk-password
    type: Opaque
    stringData:
      pwd: kiosk-test-password

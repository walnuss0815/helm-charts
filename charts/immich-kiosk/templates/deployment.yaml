apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "immich-kiosk.fullname" . }}
  labels:
    {{- include "immich-kiosk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "immich-kiosk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "immich-kiosk.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "immich-kiosk.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: KIOSK_IMMICH_URL
              value: {{ .Values.immich.url }}
            - name: KIOSK_IMMICH_API_KEY
              {{- include "immich-kiosk.secretEnvVar" .Values.immich.apiKey | indent 14 }}
            {{- if .Values.immich.externalURL }}
            - name: KIOSK_IMMICH_EXTERNAL_URL
              value: {{ .Values.immich.externalURL }}
            {{- end }}
            - name: KIOSK_BEHIND_PROXY
              value: "true"
            {{- if include "immich-kiosk.secretConfigured" .Values.password }}
            - name: KIOSK_PASSWORD_FILE
              value: /etc/immich-kiosk/secrets/password
            {{- end }}
            {{- if include "immich-kiosk.secretConfigured" .Values.immich.apiKey }}
            - name: KIOSK_IMMICH_API_KEY_FILE
              value: /etc/immich-kiosk/secrets/immich-api-key
            {{- end }}
            {{- if include "immich-kiosk.secretConfigured" .Values.weather.apiKey }}
            - name: KIOSK_WEATHER_API_KEY_FILE
              value: /etc/immich-kiosk/secrets/weather-api-key
            {{- end }}
            - name: LANG
              value: {{ .Values.lang }}
            - name: TZ
              value: {{ .Values.timeZone }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ (tpl $value $) | quote }}
            {{- end }}
            {{- range $key, $value := .Values.envFrom }}
            - name: {{ $key | quote }}
              valueFrom: {{ toYaml $value | nindent 16 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: custom-css
              mountPath: /custom.css
              subPath: custom.css
            - name: offline-assets
              mountPath: /offline-assets
            {{- if include "immich-kiosk.secretConfigured" .Values.immich.apiKey }}
            - name: secret-immich-api-key
              mountPath: /etc/immich-kiosk/secrets/immich-api-key
              subPath: {{ include "immich-kiosk.secretKey" (dict "config" .Values.immich.apiKey "default" "immich-api-key") }}
              readOnly: true
            {{- end }}
            {{- if include "immich-kiosk.secretConfigured" .Values.password }}
            - name: secret-password
              mountPath: /etc/immich-kiosk/secrets/password
              subPath: {{ include "immich-kiosk.secretKey" (dict "config" .Values.password "default" "password") }}
              readOnly: true
            {{- end }}
            {{- if include "immich-kiosk.secretConfigured" .Values.weather.apiKey }}
            - name: secret-weather-api-key
              mountPath: /etc/immich-kiosk/secrets/weather-api-key
              subPath: {{ include "immich-kiosk.secretKey" (dict "config" .Values.weather.apiKey "default" "weather-api-key") }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "immich-kiosk.fullname" $ }}-config
        - name: custom-css
          configMap:
            name: {{ include "immich-kiosk.fullname" $ }}-custom-css
        - name: offline-assets
          emptyDir:
            sizeLimit: 500Mi
        {{- if include "immich-kiosk.secretConfigured" .Values.immich.apiKey }}
        - name: secret-immich-api-key
          secret:
            secretName: {{ include "immich-kiosk.secretName" (dict "root" $ "config" .Values.immich.apiKey "suffix" "immich-api-key") }}
        {{- end }}
        {{- if include "immich-kiosk.secretConfigured" .Values.password }}
        - name: secret-password
          secret:
            secretName: {{ include "immich-kiosk.secretName" (dict "root" $ "config" .Values.password "suffix" "password") }}
        {{- end }}
        {{- if include "immich-kiosk.secretConfigured" .Values.weather.apiKey }}
        - name: secret-weather-api-key
          secret:
            secretName: {{ include "immich-kiosk.secretName" (dict "root" $ "config" .Values.weather.apiKey "suffix" "weather-api-key") }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

# Default CI install values.
#
# The chart default `postgres.enabled: true` is kept: the install test cluster
# gets the CloudNativePG operator (see .github/workflows/ci.yaml), so the bundled
# CNPG Cluster is exercised end-to-end. CloudNativePG generates a random
# password itself, which the workloads resolve from the operator-managed
# `<fullname>-postgresql-app` Secret.

# Exercise the microservices HPA in the install test. It never scales above
# `minReplicas` because the test cluster has no metrics-server.
microservices:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

# Same for the machine-learning HPA, together with the multi-node scaling
# options: a per-pod `emptyDir` model cache, topology spread and a PDB.
machineLearning:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  podDisruptionBudget:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: machine-learning

persistence:
  media:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce
  modelCache:
    # Workaround: No ReadWriteMany storage in the CI, so use a per-pod cache
    type: emptyDir

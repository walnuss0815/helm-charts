# Install test bootstrapping the bundled CNPG Cluster from an existing Secret
# referenced via `postgres.password.secretKeyRef` (ExternalSecret-style). The
# same Secret provides `DB_PASSWORD` to the workloads. Also exercises the
# non-superuser database role (`postgres.superuser: false`).

postgres:
  superuser: false
  password:
    secretKeyRef:
      name: immich-ci-db-credentials
      key: password

persistence:
  media:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce

extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: immich-ci-db-credentials
    type: kubernetes.io/basic-auth
    stringData:
      username: immich
      password: immich-ci-password

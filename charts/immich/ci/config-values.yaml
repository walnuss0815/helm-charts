# Install test rendering the Immich config file.
#
# The base config (with `${TOKEN}` placeholders) goes into a ConfigMap; the
# substitution values are supplied via `config.env` and injected at pod start.
# This exercises all three value sources: a plain `value`, an existing
# `secretKeyRef` and a `configMapRef`.

config:
  content:
    newVersionCheck:
      enabled: true
    oauth:
      enabled: false
      clientId: "immich-ci-client"
      clientSecret: ${OAUTH_CLIENT_SECRET}
    trash:
      enabled: true
      days: 30
  env:
    OAUTH_CLIENT_SECRET:
      value: "immich-ci-oauth-secret"
    SMTP_PASSWORD:
      secretKeyRef:
        name: immich-ci-smtp
        key: password
    THEME_CSS:
      configMapRef:
        name: immich-ci-theme
        key: brand

persistence:
  media:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce
  modelCache:
    # Workaround: No ReadWriteMany storage in the CI, so use a per-pod cache
    type: emptyDir

extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: immich-ci-smtp
    stringData:
      password: immich-ci-smtp-password
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: immich-ci-theme
    data:
      brand: "immich-ci-brand"

# Exercise extra volumes (external library stand-in) and non-string extraEnv values.
server:
  trustedProxies:
    - 10.244.0.0/16
  extraVolumes: &extLib
    - name: external-library
      emptyDir: {}
  extraVolumeMounts: &extLibMount
    - name: external-library
      mountPath: /mnt/external
      readOnly: true
microservices:
  extraVolumes: *extLib
  extraVolumeMounts: *extLibMount
machineLearning:
  extraEnv:
    MACHINE_LEARNING_MODEL_TTL: 600

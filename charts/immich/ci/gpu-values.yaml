# Install test exercising the hardware-acceleration values. No GPU/accelerator
# is present in the test cluster, so only the values plumbing (tolerations,
# supplemental groups and the ffmpeg acceleration setting in the config file)
# is exercised, not actual devices.
# Uses the bundled CNPG Cluster (chart default) for the database.

machineLearning:
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
  # tagSuffix: -cuda
  # resources:
  #   limits:
  #     nvidia.com/gpu: "1"

microservices:
  podSecurityContext:
    fsGroup: 1000
    # GID of the host `render` group (device access for VAAPI/QSV)
    supplementalGroups:
      - 993

config:
  content:
    ffmpeg:
      accel: vaapi
      accelDecode: true

persistence:
  media:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce
  modelCache:
    # Workaround: No ReadWriteMany storage in the CI, so use a per-pod cache
    type: emptyDir

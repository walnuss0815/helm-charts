# Install test with Prometheus metrics enabled. The server and microservices
# workloads get `IMMICH_TELEMETRY_INCLUDE=all` and expose metrics ports.
# ServiceMonitors are opt-in (`monitoring.serviceMonitors.enabled`) and are not
# created here: the chart-testing kind cluster has no Prometheus Operator CRDs.
# Uses the bundled CNPG Cluster (chart default) for the database.

monitoring:
  enabled: true
  serviceMonitors:
    enabled: false

persistence:
  media:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce
  modelCache:
    # Workaround: No ReadWriteMany storage in the CI, so use a per-pod cache
    type: emptyDir

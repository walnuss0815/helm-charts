# Install test with the bundled immich-upload-optimizer sub-chart enabled.
# Exercises the dependency wiring and the auto-computed `upload-optimizer.upstream`
# default, which resolves correctly here because the chart-testing release name
# contains "immich".
# Uses the bundled CNPG Cluster (chart default) for the database.

upload-optimizer:
  enabled: true

persistence:
  media:
    # Workaround: The PVC cannot be created in ReadWriteMany mode in the CI
    accessModes:
      - ReadWriteOnce
  modelCache:
    # Workaround: No ReadWriteMany storage in the CI, so use a per-pod cache
    type: emptyDir

{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "immich.fullname" . }}-postgresql
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- with .Values.postgres.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  description: Immich PostgreSQL cluster
  imageName: {{ include "immich.databaseImage" . }}
  instances: {{ .Values.postgres.instances }}
  {{- with .Values.postgres.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $preload := uniq (concat (list "vchord.so") .Values.postgres.extraSharedPreloadLibraries) }}
  postgresql:
    shared_preload_libraries:
      {{- toYaml $preload | nindent 6 }}
    {{- if or .Values.postgres.vchord.enabled .Values.postgres.extraExtensions }}
    extensions:
      {{- if .Values.postgres.vchord.enabled }}
      {{- include "immich.vchordExtension" . | nindent 6 }}
      {{- end }}
      {{- with .Values.postgres.extraExtensions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  managed:
    roles:
      - name: {{ include "immich.databaseUser" . }}
        ensure: present
        login: true
        superuser: {{ .Values.postgres.superuser }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
    size: {{ .Values.postgres.storage.size | quote }}
  bootstrap:
    initdb:
      database: {{ include "immich.databaseName" . }}
      owner: {{ include "immich.databaseUser" . }}
      {{- if include "immich.databasePasswordProvided" . }}
      secret:
        name: {{ include "immich.bootstrapSecretName" . }}
      {{- end }}
      {{- if .Values.postgres.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml .Values.postgres.postInitApplicationSQL | nindent 8 }}
      {{- end }}
  {{- if .Values.postgres.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | toString | quote }}
    {{- if .Values.postgres.backup.barmanObjectStore }}
    barmanObjectStore:
      {{- toYaml .Values.postgres.backup.barmanObjectStore | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if .Values.postgres.monitoring.enablePodMonitor }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
{{- end }}

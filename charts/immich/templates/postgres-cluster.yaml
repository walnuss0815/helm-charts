{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "immich.databaseClusterName" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- if or .Values.postgres.keep .Values.postgres.annotations }}
  annotations:
    {{- if .Values.postgres.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.postgres.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  description: Immich PostgreSQL cluster
  imageName: {{ include "immich.databaseImage" . }}
  instances: {{ .Values.postgres.instances }}
  {{- with .Values.postgres.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $preload := uniq (concat (list "vchord.so") .Values.postgres.extraSharedPreloadLibraries) }}
  postgresql:
    shared_preload_libraries:
      {{- toYaml $preload | nindent 6 }}
    {{- if or .Values.postgres.vchord.enabled .Values.postgres.extraExtensions }}
    extensions:
      {{- if .Values.postgres.vchord.enabled }}
      {{- include "immich.vchordExtension" . | nindent 6 }}
      {{- end }}
      {{- with .Values.postgres.extraExtensions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  managed:
    roles:
      - name: {{ .Values.postgres.user }}
        ensure: present
        login: true
        superuser: {{ .Values.postgres.superuser }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* CloudNativePG only knows these fields below spec.affinity */ -}}
  {{- $affinity := deepCopy (.Values.postgres.affinity | default dict) }}
  {{- with .Values.postgres.nodeSelector }}
  {{- $_ := set $affinity "nodeSelector" . }}
  {{- end }}
  {{- with .Values.postgres.tolerations }}
  {{- $_ := set $affinity "tolerations" . }}
  {{- end }}
  {{- with $affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
    size: {{ .Values.postgres.storage.size | quote }}
  {{- $bk := .Values.postgres.backup }}
  {{- $rec := .Values.postgres.recovery }}
  {{- if include "immich.walArchivingEnabled" . }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "immich.backupObjectStoreName" . }}
        {{- with $bk.objectStore.serverName }}
        serverName: {{ . }}
        {{- end }}
  {{- end }}
  {{- if and $bk.enabled (or $bk.target (eq $bk.method "volumeSnapshot")) }}
  backup:
    {{- with $bk.target }}
    target: {{ . }}
    {{- end }}
    {{- if eq $bk.method "volumeSnapshot" }}
    volumeSnapshot:
      {{- toYaml $bk.volumeSnapshot | nindent 6 }}
    {{- end }}
  {{- end }}
  bootstrap:
    {{- if $rec.enabled }}
    recovery:
      {{- with $rec.volumeSnapshots }}
      volumeSnapshots:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      source: backup-source
      {{- end }}
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.user }}
      {{- if include "immich.databasePasswordProvided" . }}
      secret:
        name: {{ include "immich.bootstrapSecretName" . }}
      {{- end }}
      {{- with $rec.recoveryTarget }}
      recoveryTarget:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.user }}
      {{- if include "immich.databasePasswordProvided" . }}
      secret:
        name: {{ include "immich.bootstrapSecretName" . }}
      {{- end }}
      {{- if .Values.postgres.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml .Values.postgres.postInitApplicationSQL | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if and $rec.enabled (not $rec.volumeSnapshots) }}
  externalClusters:
    - name: backup-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ $rec.objectStoreName | default (include "immich.backupObjectStoreName" .) }}
          serverName: {{ $rec.serverName | default (include "immich.databaseClusterName" .) }}
  {{- end }}
{{- end }}

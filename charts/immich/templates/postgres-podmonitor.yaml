{{- if and .Values.postgres.enabled .Values.postgres.monitoring.enablePodMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "immich.databaseClusterName" . }}-metrics
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "immich.databaseClusterName" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
{{- end }}

{{- $cache := .Values.persistence.modelCache }}
{{- if and .Values.machineLearning.enabled (eq $cache.type "pvc") (not $cache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "immich.modelCacheVolumeName" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
  {{- with $cache.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteMany
  {{- with $cache.storageClass }}
  {{- if eq "-" . }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $cache.size | quote }}
{{- end }}

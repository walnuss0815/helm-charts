{{- include "immich.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "immich.fullname" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  {{- with .Values.server.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "immich.componentSelectorLabels" (dict "root" $ "component" "server") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/immich-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        checksum/immich-config-file: {{ include (print $.Template.BasePath "/configmap-config-file.yaml") . | sha256sum }}
        checksum/immich-secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "immich.componentSelectorLabels" (dict "root" $ "component" "server") | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "immich.serviceAccountName" . }}
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      {{- if include "immich.configFileEnabled" . }}
      initContainers:
        {{- include "immich.configFileInitContainer" (dict "root" $ "workload" .Values.server) | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ include "immich.image" (dict "root" $ "workload" .Values.server) }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
            {{- if .Values.monitoring.enabled }}
            - name: metrics-api
              containerPort: {{ .Values.monitoring.apiMetricsPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "immich.envConfigName" . }}
          env:
            - name: IMMICH_WORKERS_INCLUDE
              value: "api"
            - name: IMMICH_PORT
              value: {{ .Values.server.service.port | toString | quote }}
            {{- with .Values.server.trustedProxies }}
            - name: IMMICH_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.monitoring.enabled }}
            - name: IMMICH_API_METRICS_PORT
              value: {{ .Values.monitoring.apiMetricsPort | toString | quote }}
            {{- end }}
            {{- if or .Values.postgres.enabled (include "immich.databasePasswordProvided" .) }}
            - name: DB_PASSWORD
              {{- include "immich.databasePasswordEnv" . | nindent 14 }}
            {{- end }}
            {{- if include "immich.secretConfigured" .Values.redis.password }}
            - name: REDIS_PASSWORD
              {{- include "immich.secretEnvVar" (dict "root" $ "entry" .Values.redis.password "secret" (include "immich.redisPasswordName" .) "key" "password") | nindent 14 }}
            {{- end }}
            {{- if include "immich.configFileEnabled" . }}
            - name: IMMICH_CONFIG_FILE
              value: {{ include "immich.configFilePath" . }}
            {{- end }}
            {{- range $key, $value := .Values.server.extraEnv }}
            - name: {{ $key | quote }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- range $key, $valueFrom := .Values.server.extraEnvFrom }}
            - name: {{ $key | quote }}
              valueFrom: {{ toYaml $valueFrom | nindent 16 }}
            {{- end }}
          {{- with .Values.server.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: media
              mountPath: /data
            {{- if include "immich.configFileEnabled" . }}
            {{- include "immich.configFileVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "immich.mediaVolumeName" . }}
        {{- if include "immich.configFileEnabled" . }}
        {{- include "immich.configFileVolumes" . | nindent 8 }}
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

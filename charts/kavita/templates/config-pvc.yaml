{{- with .Values.persistence.config }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "kavita.fullname" $ }}-config
  labels:
    {{- include "kavita.labels" $ | nindent 4 }}
  {{- if or .keep .annotations }}
  annotations:
    {{- if .keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
  {{- if not (empty .accessModes) }}
  {{- range .accessModes }}
    - {{ . | quote }}
  {{- end }}
  {{- else }}
    - {{ .accessMode | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size | quote }}
  {{- with .storageClass }}
  {{- if eq "-" . }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}

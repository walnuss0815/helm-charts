# Default values for kavita.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the Kavita deployment. See [Kubernetes docs](https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/)
replicaCount: 1

# -- Container image configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/containers/images/)
image:
  # -- Container image repository
  repository: jvmilazz0/kavita
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- Secrets for pulling images from a private registry. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/)
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full resource name
fullnameOverride: ""

# -- Service account configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/security/service-accounts/)
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount the ServiceAccount's API credentials into the pod
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use. If not set and `create` is `true`, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the pod. See [Kubernetes docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/)
podAnnotations: {}
# -- Labels to add to the pod. See [Kubernetes docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

# -- Container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Kubernetes Service configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/services-networking/service/)
service:
  # -- Service type. See [service types](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types)
  type: ClusterIP
  # -- Service port. Also used as the container port, so it must match the port Kavita listens on (`5000`)
  port: 5000

# -- Ingress configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/services-networking/ingress/)
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts and paths
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via a Gateway API HTTPRoute.
# Requires the Gateway API CRDs and a suitable controller in the cluster. See [Gateway API guides](https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # -- Enable HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Gateways this route is attached to
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # -- Hostnames matching the HTTP Host header
  hostnames:
  - chart-example.local
  # -- Routing rules and filters applied to matched requests
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Resource requests and limits for the Kavita container. See [Kubernetes docs](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration. Empty disables the probe. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
livenessProbe:
  httpGet:
    path: /
    port: http
# -- Readiness probe configuration. Empty disables the probe
readinessProbe:
  httpGet:
    path: /
    port: http

# -- Additional volumes for the pod
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volume mounts for the Kavita container
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Extra Kubernetes manifests to deploy alongside the chart. Each entry is rendered with `tpl`
extraManifests: []

# -- Persistence configuration for the Kavita volumes. Both PVCs are always created
persistence:
  # -- Config directory, mounted at `/kavita/config` (database, settings, covers)
  config:
    # -- Annotations for the config PVC
    annotations: {}
    # -- Storage class for the config PVC. `-` leaves `storageClassName` unset, so the cluster's default StorageClass is used
    storageClass: "-"
    # -- Size of the config PVC
    size: "1Gi"
    # -- Access modes for the config PVC
    accessModes:
      - ReadWriteOnce
  # -- Library directory, mounted at `/library` (books, comics, manga)
  library:
    # -- Annotations for the library PVC
    annotations: {}
    # -- Storage class for the library PVC. `-` leaves `storageClassName` unset, so the cluster's default StorageClass is used
    storageClass: "-"
    # -- Size of the library PVC
    size: "1Gi"
    # -- Access modes for the library PVC
    accessModes:
      - ReadWriteOnce

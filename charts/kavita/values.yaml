# Default values for kavita.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the Kavita deployment
# For more information, see: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# @default -- `1`
replicaCount: 1

# -- Container image configuration
# For more information, see: https://kubernetes.io/docs/concepts/containers/images/
image:
  # -- Container image repository
  repository: jvmilazz0/kavita
  # -- Image pull policy
  # @default -- `IfNotPresent`
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  # @default -- `0.8.9`
  tag: "0.8.9"

# -- Image pull secrets for private registries
# For more information, see: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- Overrides the name of the chart
nameOverride: ""
# -- Overrides the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
# For more information, see: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  # @default -- `true`
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  # @default -- `true`
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  # @default -- `""`
  name: ""

# -- Annotations to add to the pod
# For more information, see: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- Labels to add to the pod
# For more information, see: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- Pod security context configuration
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context configuration
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Service configuration
# For more information, see: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- Service type
  # For more information, see: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  # @default -- `ClusterIP`
  type: ClusterIP
  # -- Service port
  # For more information, see: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # @default -- `5000`
  port: 5000

# -- Ingress configuration
# For more information, see: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # -- Enable Ingress
  # @default -- false
  enabled: false
  # -- Ingress Class Name
  # @default -- `""`
  className: ""
  # -- Annotations for Ingress
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # -- HTTPRoute enabled
  # @default -- false
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Which Gateways this Route is attached to
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # -- Hostnames matching HTTP header
  hostnames:
  - chart-example.local
  # -- List of rules and filters applied
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Resource limits and requests for the Kavita container
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration
# For more information, see: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  # -- HTTP GET configuration for liveness probe
  httpGet:
    # -- Health check endpoint path
    path: /
    # -- Health check endpoint port
    port: http
# -- Readiness probe configuration
# For more information, see: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readinessProbe:
  # -- HTTP GET configuration for readiness probe
  httpGet:
    # -- Health check endpoint path
    path: /
    # -- Health check endpoint port
    port: http

# -- Additional volumes on the output Deployment definition
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volumeMounts on the output Deployment definition
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Extra Kubernetes manifests to deploy
extraManifests: []

# -- Persistence configuration for Kavita volumes
persistence:
  # -- Config directory persistence configuration
  config:
    # -- Annotations for the config PVC
    annotations: {}
    # -- Storage class for config PVC
    # @default -- `"-"`
    storageClass: "-"
    # -- Size of the config PVC
    # @default -- `"1Gi"`
    size: "1Gi"
    # -- Access modes for config PVC
    # @default -- `ReadWriteOnce`
    accessModes:
      - ReadWriteOnce
  # -- Library directory persistence configuration
  library:
    # -- Annotations for the library PVC
    annotations: {}
    # -- Storage class for library PVC
    # @default -- `"-"`
    storageClass: "-"
    # -- Size of the library PVC
    # @default -- `"1Gi"`
    size: "1Gi"
    # -- Access modes for library PVC
    # @default -- `ReadWriteOnce`
    accessModes:
      - ReadWriteOnce

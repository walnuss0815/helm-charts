# All credentials come from existing Secrets (GitOps style). The passwords
# contain `$` to check that they are passed through unchanged (KCRAW_).
keycloak:
  hostname: http://keycloak.example.test

bootstrapAdmin:
  user:
    password:
      secretKeyRef:
        name: keycloak-ci-admin
        key: password
  client:
    enabled: true
    clientSecret:
      secretKeyRef:
        name: keycloak-ci-admin
        key: client-secret

postgres:
  password:
    secretKeyRef:
      name: keycloak-ci-db
      key: password

extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: keycloak-ci-admin
    stringData:
      password: ci-admin-pa$$word${x}
      client-secret: ci-client-se$$cret
  - |
    apiVersion: v1
    kind: Secret
    type: kubernetes.io/basic-auth
    metadata:
      name: keycloak-ci-db
    stringData:
      username: keycloak
      password: ci-db-pa$$word${x}

# TLS re-encrypt: Keycloak serves HTTPS only, the management interface uses
# HTTPS as well. The certificate is a throw-away self-signed one.
keycloak:
  hostname: https://keycloak.example.test

tls:
  enabled: true
  secretName: keycloak-ci-tls

bootstrapAdmin:
  user:
    password:
      value: ci-admin-password

# No Ingress controller is needed: the Ingress is only created, which checks
# its schema and the HTTPS backend port.
ingress:
  enabled: true
  hosts:
    - host: keycloak.example.test
      paths:
        - path: /
          pathType: Prefix

# No metrics-server is needed: the HPA keeps the Deployment at minReplicas.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

extraManifests:
  - |
    {{- $cert := genSelfSignedCert "keycloak.example.test" nil (list "keycloak.example.test") 7 }}
    apiVersion: v1
    kind: Secret
    type: kubernetes.io/tls
    metadata:
      name: keycloak-ci-tls
    data:
      tls.crt: {{ $cert.Cert | b64enc }}
      tls.key: {{ $cert.Key | b64enc }}

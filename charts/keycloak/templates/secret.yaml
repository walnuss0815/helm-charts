{{- if include "keycloak.bootstrapAdminSecretEnabled" . }}
{{- $user := .Values.bootstrapAdmin.user -}}
{{- $client := .Values.bootstrapAdmin.client -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "keycloak.bootstrapAdminSecretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- if include "keycloak.bootstrapAdminGenerate" . }}
  annotations:
    # Keep generated credentials: Keycloak only reads them on its first start.
    helm.sh/resource-policy: keep
  {{- end }}
stringData:
  {{- if $user.enabled }}
  username: {{ $user.username | quote }}
  {{- if not (include "keycloak.secretRefSet" $user.password) }}
  password: {{ include "keycloak.bootstrapAdminSecretValue" (dict "root" $ "entry" $user.password "key" "password") | quote }}
  {{- end }}
  {{- end }}
  {{- if $client.enabled }}
  client-id: {{ $client.clientId | quote }}
  {{- if not (include "keycloak.secretRefSet" $client.clientSecret) }}
  client-secret: {{ include "keycloak.bootstrapAdminSecretValue" (dict "root" $ "entry" $client.clientSecret "key" "client-secret") | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if and .Values.postgres.password.value (not (include "keycloak.secretRefSet" .Values.postgres.password)) (not .Values.postgres.bootstrapSecretOverride) }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ include "keycloak.databaseCredentialName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password.value | quote }}
{{- end }}

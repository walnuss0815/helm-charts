nextauth:
  secret:
    secretKeyRef:
      name: "linkwarden-secrets"
      key: "nextauth-secret"

# The app hard-requires a reachable database at boot regardless of the
# `database.enabled` toggle - use the bundled postgres dependency.
postgres:
  enabled: true

extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: "linkwarden-secrets"
    stringData:
      nextauth-secret: "ci-test-secret"

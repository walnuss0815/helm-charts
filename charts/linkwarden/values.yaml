# Default values for linkwarden.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the linkwarden deployment
replicaCount: 1

# -- Container image configuration
image:
  # -- Container image repository
  repository: ghcr.io/linkwarden/linkwarden
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to `v<Chart.AppVersion>` if not set
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context configuration
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# -- Container security context configuration
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 3000

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts configuration
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # -- HTTPRoute enabled
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Which Gateways this Route is attached to
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # -- Hostnames matching HTTP header
  hostnames:
  - chart-example.local
  # -- List of rules and filters applied
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Resource limits and requests for the linkwarden container
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Extra Kubernetes manifests to deploy
extraManifests: []

# -- Extra environment variables (templated), keyed by variable name
env: {}

# -- Populate environment variables in bulk from existing ConfigMaps and/or Secrets.
# Follows the standard Kubernetes envFrom schema:
# https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/#configure-all-key-value-pairs-in-a-secret-as-container-environment-variables
envFrom: []
# - configMapRef:
#     name: my-configmap
# - secretRef:
#     name: my-secret

# -- Persistence configuration for the linkwarden data directory
persistence:
  data:
    # -- Annotations for the data PVC
    annotations: {}
    # -- Storage class for the data PVC
    storageClass: "-"
    # -- Size of the data PVC
    size: "2Gi"
    # -- Access modes for the data PVC
    accessModes:
      - ReadWriteOnce

# -- NextAuth configuration
nextauth:
  # -- Public URL of the NextAuth API endpoint. Must be set to the real,
  # externally-reachable URL in any non-local deployment - NextAuth uses
  # this for redirect/callback validation, so a stale/incorrect value here
  # is a functional and security concern (e.g. behind an Ingress, this must
  # match the Ingress host, not localhost)
  url: "http://localhost:3000/api/v1/auth"
  # -- NextAuth session-signing secret configuration. Must be set via `.value` or `.secretKeyRef` - there is no default
  secret:
    # -- Plain-text secret value. Ignored if `secretKeyRef.name` is set
    value: ""
    # -- Reference to an existing secret containing the NextAuth secret
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

# -- Authentication configuration
auth:
  # -- Disable new user registration
  disableRegistration: false

# -- Bundled PostgreSQL subchart configuration (disabled by default; mainly intended for
# testing/CI - see [postgres chart](../postgres) for all available options). When enabled,
# this takes precedence over `database.*` for wiring the DATABASE_* env vars.
postgres:
  # -- Enable the bundled PostgreSQL subchart instead of an external database via `database.*`
  enabled: false
  # -- Secret configuration for database credentials, also used by this chart to know which
  # secret to read DATABASE_* env vars from
  secret:
    # -- Create a new secret for database credentials
    create: true
    # -- Name of the secret (supports Helm templating)
    name: '{{ .Release.Name }}-db'

# -- External database connection configuration. Only used if `postgres.enabled` is `false`
database:
  # -- Enable configuring an external database connection
  enabled: false
  # -- Full database connection URL configuration. Defaults to composing the URL from the individual host/port/name/username/password fields below via Kubernetes env var interpolation
  url:
    # -- Plain-text URL value. Ignored if `secretKeyRef.name` is set
    value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
    # -- Reference to an existing secret containing the full database URL
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""
  # -- Database hostname
  host: ""
  # -- Database port
  port: 5432
  # -- Database name
  name: linkwarden
  # -- Database username configuration. Must be set via `.value` or `.secretKeyRef` - there is no default
  username:
    # -- Plain-text username value. Ignored if `secretKeyRef.name` is set
    value: ""
    # -- Reference to an existing secret containing the database username
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""
  # -- Database password configuration. Must be set via `.value` or `.secretKeyRef` - there is no default
  password:
    # -- Plain-text password value. Ignored if `secretKeyRef.name` is set
    value: ""
    # -- Reference to an existing secret containing the database password
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

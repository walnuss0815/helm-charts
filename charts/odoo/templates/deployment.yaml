apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "odoo.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "odoo.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: template-config
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
                python3 - /etc/odoo.template/ /etc/odoo/ <<'EOF'
                {{- .Files.Get "scripts/template-dir.py" | nindent 16 -}}
                EOF
          env:
            {{- if .Values.postgres.enabled }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postgres.secret.name . }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postgres.secret.name . }}
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postgres.secret.name . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.postgres.secret.name . }}
                  key: password
            {{- else }}
            - name: DB_HOST
              value: {{ .Values.database.host }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              {{- include "odoo.secretEnvVar" .Values.database.user | nindent 14 }}
            - name: DB_PASSWORD
              {{- include "odoo.secretEnvVar" .Values.database.password | nindent 14 }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ (tpl $value $) | quote }}
            {{- end }}
            {{- range $key, $value := .Values.envFrom }}
            - name: {{ $key | quote }}
              valueFrom: {{ toYaml $value | nindent 16 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-templates
              mountPath: /etc/odoo.template
            - name: config
              mountPath: /etc/odoo
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ (tpl $value $) | quote }}
            {{- end }}
            {{- range $key, $value := .Values.envFrom }}
            - name: {{ $key | quote }}
              valueFrom: {{ toYaml $value | nindent 16 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
            - name: extra-addons
              mountPath: /mnt/extra-addons
            - name: config
              mountPath: /etc/odoo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "odoo.fullname" $ }}-data
        - name: extra-addons
          persistentVolumeClaim:
            claimName: {{ include "odoo.fullname" $ }}-addons
        - name: config-templates
          configMap:
            name: {{ include "odoo.fullname" $ }}-config
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

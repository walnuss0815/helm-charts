# All secret-backed values come from pre-existing Secrets.
auth:
  uiPassword:
    secretKeyRef:
      name: openchamber-ci-creds
      key: ui-password
  jwtSecret:
    secretKeyRef:
      name: openchamber-ci-creds
      key: jwt-secret
envFrom:
  - secretRef:
      name: openchamber-ci-provider-keys
extraManifests:
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: openchamber-ci-creds
    stringData:
      ui-password: "ci-password"
      jwt-secret: "ci-jwt-secret-with-enough-length-0123456789"
  - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: openchamber-ci-provider-keys
    stringData:
      OPENCODE_DISABLE_AUTOUPDATE: "true"

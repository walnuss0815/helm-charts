{{- $data := dict }}
{{- range $key, $entry := (include "openchamber.secretItems" . | fromYaml) }}
{{- if not (include "openchamber.hasSecretRef" $entry.item) }}
{{- $_ := set $data $key $entry.item.value }}
{{- end }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openchamber.secretName" . }}
  labels:
    {{- include "openchamber.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "paperless-ai.fullname" $ }}-data
  labels:
    {{- include "paperless-ai.labels" $ | nindent 4 }}
  {{- if or .Values.persistence.data.keep .Values.persistence.data.annotations }}
  annotations:
    {{- if .Values.persistence.data.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.data.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
  {{- if not (empty .Values.persistence.data.accessModes) }}
  {{- range .Values.persistence.data.accessModes }}
    - {{ . | quote }}
  {{- end }}
  {{- else }}
    - {{ .Values.persistence.data.accessMode | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size | quote }}
  {{- with .Values.persistence.data.storageClass }}
  {{- if eq "-" . }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}

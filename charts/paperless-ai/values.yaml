# Default values for paperless-ai.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the paperless-ai deployment
# @default -- `1`
replicaCount: 1

# -- Container image configuration
image:
  # -- Container image repository
  repository: clusterzx/paperless-ai
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials. paperless-ai does
  # not need access to the Kubernetes API
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context. The image runs as root (no USER in its Dockerfile)
# and existing data volumes are owned by root, so the user is not changed. To
# run as non-root, set `runAsUser`, `runAsGroup` and `fsGroup` and make sure
# the data volume belongs to that user
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. Capabilities are kept so that root can still
# write to volumes owned by other users
securityContext:
  allowPrivilegeEscalation: false

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 3000

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts configuration
  hosts:
    # -- Hostname for ingress
    - host: chart-example.local
      # -- Paths configuration for the host
      paths:
        # -- Path to route
        - path: /
          # -- Path type (ImplementationSpecific, Exact, Prefix)
          pathType: ImplementationSpecific
  # -- TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Gateway API HTTPRoute configuration (requires Gateway API CRDs installed)
httpRoute:
  # -- Enable HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Parent gateway references to attach this route to
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames for HTTP header matching
  hostnames:
    - chart-example.local
  # -- Routing rules and filters
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Resource requests and limits for the paperless-ai container. Runs Node.js
# and a Python RAG service with torch and sentence-transformers. Set `limits`
# to `null` to remove the memory limit
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 3Gi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Persistence configuration for paperless-ai data
persistence:
  # -- Data directory persistence configuration
  data:
    # -- Keep the data PVC when the release is uninstalled or the Argo CD
    # Application is deleted (`helm.sh/resource-policy: keep`). It holds the
    # application data and settings. Delete it manually with
    # `kubectl delete pvc <fullname>-data`
    keep: true
    # -- Annotations for the data PVC
    annotations: {}
    # -- Storage class for data PVC. Empty uses the cluster's default StorageClass; `-` sets `storageClassName: ""`, which disables dynamic provisioning
    storageClass: ""
    # -- Size of the data PVC
    size: "1Gi"
    # -- Access modes for data PVC
    accessModes:
      - ReadWriteOnce

# Default values for paperless-ai.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the paperless-ai deployment
# @default -- `1`
replicaCount: 1

# -- Container image configuration
image:
  # -- Container image repository
  repository: clusterzx/paperless-ai
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context configuration
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context configuration
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 3000

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts configuration
  hosts:
    # -- Hostname for ingress
    - host: chart-example.local
      # -- Paths configuration for the host
      paths:
        # -- Path to route
        - path: /
          # -- Path type (ImplementationSpecific, Exact, Prefix)
          pathType: ImplementationSpecific
  # -- TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Gateway API HTTPRoute configuration (requires Gateway API CRDs installed)
httpRoute:
  # -- Enable HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Parent gateway references to attach this route to
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames for HTTP header matching
  hostnames:
    - chart-example.local
  # -- Routing rules and filters
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Resource limits and requests for the paperless-ai container
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Persistence configuration for paperless-ai data
persistence:
  # -- Data directory persistence configuration
  data:
    # -- Annotations for the data PVC
    annotations: {}
    # -- Storage class for data PVC
    storageClass: "-"
    # -- Size of the data PVC
    size: "1Gi"
    # -- Access modes for data PVC
    accessModes:
      - ReadWriteOnce

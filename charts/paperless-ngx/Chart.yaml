apiVersion: v2
name: paperless-ngx
description: A Helm chart for Kubernetes
type: application
version: 0.2.1
appVersion: "2.20.8"
maintainers:
  - name: walnuss0815
    email: walnuss0815@gmail.com
    url: https://github.com/walnuss0815

dependencies:
  - name: redis
    version: "21.2.14"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: webdav
    version: "0.1.8"
    repository: https://walnuss0815.github.io/helm-charts
    condition: webdav.enabled
  - name: tika
    version: "0.1.2"
    repository: https://walnuss0815.github.io/helm-charts
    condition: tika.enabled
  - name: gotenberg
    version: "0.1.5"
    repository: https://walnuss0815.github.io/helm-charts
    condition: gotenberg.enabled

{{- include "paperless-ngx.validateWebdavClaimName" . }}
{{- range $key, $value := .Values.persistence }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "paperless-ngx.fullname" $ }}-{{ $key }}
  labels:
    {{- include "paperless-ngx.labels" $ | nindent 4 }}
  {{- if or $value.keep $value.annotations }}
  annotations:
    {{- if $value.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with $value.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
  {{- range $value.accessModes }}
    - {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $value.size | quote }}
  {{- with $value.storageClass }}
  {{- if eq "-" . }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
---
{{- end }}

# Default values for paperless-ngx.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the paperless-ngx deployment
# @default -- `1`
replicaCount: 1

# -- Container image configuration
image:
  # -- Container image repository
  repository: ghcr.io/paperless-ngx/paperless-ngx
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context configuration
podSecurityContext:
  # -- Set filesystem group ownership for mounted volumes
  fsGroup: 1000
  # -- Define behavior when fsGroup changes
  fsGroupChangePolicy: OnRootMismatch

# -- Container security context configuration
securityContext:
  # -- Linux capabilities to drop
  capabilities:
    drop:
      - ALL
  # -- Mount root filesystem as read-only
  readOnlyRootFilesystem: true
  # -- Run container as non-root user
  runAsNonRoot: true
  # -- User ID to run the container as
  runAsUser: 1000
  # -- Group ID to run the container as
  runAsGroup: 1000
  # -- Seccomp profile configuration
  seccompProfile:
    type: RuntimeDefault
  # -- Prevent privilege escalation
  allowPrivilegeEscalation: false

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 8000

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hostname
  host: "{{ .Values.host }}"
  # -- TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Gateway API HTTPRoute configuration (requires Gateway API CRDs installed)
httpRoute:
  # -- Enable HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Parent gateway references to attach this route to
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames for HTTP header matching
  hostnames:
    - chart-example.local
  # -- Routing rules and filters
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Resource requests and limits for the paperless-ngx container. Sized for
# the defaults (one web and one task worker, SQLite); raise the memory limit
# for many OCR threads, large scans or `ai.llm.embedding.backend: huggingface`
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# -- Liveness probe configuration
livenessProbe:
  # -- HTTP GET configuration for liveness probe
  httpGet:
    path: /
    port: http
  # -- Timeout in seconds for the probe
  timeoutSeconds: 5
  # -- Initial delay before starting probes
  initialDelaySeconds: 30

# -- Readiness probe configuration
readinessProbe:
  # -- HTTP GET configuration for readiness probe
  httpGet:
    path: /
    port: http
  # -- Timeout in seconds for the probe
  timeoutSeconds: 5
  # -- Initial delay before starting probes
  initialDelaySeconds: 30

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Extra Kubernetes manifests to deploy
extraManifests: []

# -- Hostname for the paperless-ngx instance
host: chart-example.local

# -- URL for the paperless-ngx instance
url: "https://{{ .Values.host }}"

# -- Django secret key (`PAPERLESS_SECRET_KEY`) used to sign sessions and tokens. Required: set
# `value` or `secretKeyRef`, otherwise rendering fails. Use a long random string and keep it stable,
# changing it signs out all users
secretKey:
  # -- Plain-text secret key. Ignored if `secretKeyRef.name` and `secretKeyRef.key` are set. Prefer `secretKeyRef`
  value: ""
  # -- Reference to existing secret containing the secret key
  secretKeyRef:
    # -- Name of the secret
    name: ""
    # -- Key within the secret
    key: ""

# -- Additional environment variables as a map of variable name to value. Values are rendered with `tpl`
env: {}

# -- Additional environment variables as a map of variable name to a Kubernetes `valueFrom` object,
# e.g. `MY_VAR: {secretKeyRef: {name: my-secret, key: my-key}}`
envFrom: {}

# -- (int) Celery task hard time limit in seconds (`PAPERLESS_WORKER_TIMEOUT`). Paperless defaults to 1800 s. It also limits
# the LLM index build (`llmindex_index`); large embedding models on CPU can exceed it on the first build. Unset or `0` keeps the default
workerTimeout: null

# -- Persistence configuration for paperless-ngx volumes
persistence:
  # -- Data directory persistence configuration
  data:
    # -- Annotations for the data PVC
    annotations: {}
    # -- Storage class for data PVC. Empty uses the cluster's default StorageClass; `-` sets `storageClassName: ""`, which disables dynamic provisioning
    storageClass: ""
    # -- Size of the data PVC
    size: "1Gi"
    # -- Access modes for data PVC
    accessModes:
      - ReadWriteOnce
  # -- Media directory persistence configuration
  media:
    # -- Annotations for the media PVC
    annotations: {}
    # -- Storage class for media PVC. Empty uses the cluster's default StorageClass; `-` sets `storageClassName: ""`, which disables dynamic provisioning
    storageClass: ""
    # -- Size of the media PVC
    size: "8Gi"
    # -- Access modes for media PVC
    accessModes:
      - ReadWriteOnce
  # -- Consumption directory persistence configuration
  consumption:
    # -- Annotations for the consumption PVC
    annotations: {}
    # -- Storage class for consumption PVC. Empty uses the cluster's default StorageClass; `-` sets `storageClassName: ""`, which disables dynamic provisioning
    storageClass: ""
    # -- Size of the consumption PVC
    size: "512Mi"
    # -- Access modes for consumption PVC. Use `ReadWriteMany` when
    # `webdav.enabled` and the webdav and paperless-ngx pods may run on
    # different nodes
    accessModes:
      - ReadWriteOnce

# -- OCR (Optical Character Recognition) configuration
ocr:
  # -- OCR languages to use (`PAPERLESS_OCR_LANGUAGE`, Tesseract codes such as
  # `deu`). The image includes `eng`, `deu`, `fra`, `ita` and `spa`; other
  # languages need a custom image, as `PAPERLESS_OCR_LANGUAGES` cannot install
  # them in this rootless, read-only container. See
  # [Tesseract language data](https://tesseract-ocr.github.io/tessdoc/Data-Files-in-different-versions.html)
  languages:
    - eng

# -- Document parser configuration
parser:
  # -- Date/time parsing locales. See [dateparser supported locales](https://dateparser.readthedocs.io/en/latest/supported_locales.html)
  datetime:
    - en

# -- Single Sign-On (SSO) configuration
sso:
  # -- Enable SSO authentication. Sets `PAPERLESS_APPS` to the OpenID Connect
  # provider app unless `PAPERLESS_APPS` is set in `env` or `envFrom`
  enabled: false
  # -- Automatically create user accounts on first SSO login
  autoSignup: false
  # -- SSO provider configuration (OpenID Connect). See [django-allauth documentation](https://docs.allauth.org/en/latest/socialaccount/providers/openid_connect.html)
  config: {}

# -- Valkey (Redis-compatible) key-value store configuration
valkeyKV:
  # -- Valkey connection URL configuration
  url:
    # -- Valkey URL value (note: paperless-ngx expects the redis:// scheme even when connecting to Valkey)
    value: 'redis://{{ .Release.Name }}-valkey:6379'
    # -- Reference to existing secret containing Valkey URL
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

# -- External database configuration
database:
  # -- Enable external database (if false, uses SQLite)
  enabled: false
  # -- Database host
  host: ""
  # -- Database engine (postgresql, mysql, mariadb)
  engine: "postgresql"
  # -- Database port
  port: 5432
  # -- Database name
  name: paperless
  # -- Database username configuration
  username:
    # -- Database username value
    value: "paperless"
    # -- Reference to existing secret containing database username
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""
  # -- Database password configuration
  password:
    # -- Database password value (use secretKeyRef in production)
    value: "paperless"
    # -- Reference to existing secret containing database password
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

# -- SMTP email configuration
smtp:
  # -- Enable SMTP email functionality
  enabled: false
  # -- SMTP server hostname
  host: ""
  # -- SMTP server port
  port: 25
  # -- Use TLS for SMTP connection
  useTLS: false
  # -- Use SSL for SMTP connection
  useSSL: false
  # -- Email address to use in 'From' field
  emailFrom: ""
  # -- SMTP username configuration
  username:
    # -- SMTP username value
    value: ""
    # -- Reference to existing secret containing SMTP username
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""
  # -- SMTP password configuration
  password:
    # -- SMTP password value (use secretKeyRef in production)
    value: ""
    # -- Reference to existing secret containing SMTP password
    secretKeyRef:
      # -- Name of the secret
      name: ""
      # -- Key within the secret
      key: ""

# -- Valkey subchart configuration (Redis-compatible key-value store)
valkey:
  # -- Enable Valkey as a subchart
  enabled: true
  # -- Valkey authentication configuration
  auth:
    # -- Enable Valkey password authentication. Disabled by default; enable it for production and include the credentials in `valkeyKV.url`
    enabled: false
  # -- Resource limits/requests for the Valkey container
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- WebDAV configuration for document consumption
webdav:
  # -- Enable WebDAV integration
  enabled: false
  # -- WebDAV persistence configuration
  persistence:
    # -- Data directory configuration
    data:
      # -- Name of the consumption PVC mounted into WebDAV. Rendered with
      # `tpl` in the webdav subchart, so it mirrors this chart's fullname
      # (including its 63-character truncation) from the release name. Set it
      # to `<fullname>-consumption` when `nameOverride` or `fullnameOverride`
      # is set
      claimName: '{{ ternary .Release.Name (printf "%s-paperless-ngx" .Release.Name) (contains "paperless-ngx" .Release.Name) | trunc 63 | trimSuffix "-" }}-consumption'

# -- Apache Tika subchart configuration (for document parsing)
tika:
  # -- Enable Apache Tika service
  enabled: true

# -- Gotenberg subchart configuration (for document conversion)
gotenberg:
  # -- Enable Gotenberg service
  enabled: true

# -- Text Embeddings Inference subchart configuration (embeddings server for the AI features). Requires `ai.enabled`.
# Wires the AI embeddings to this server through the `openai-like` backend, so the model stays out of the paperless
# data volume and its backups and is not reloaded on every query. `embeddings.model.id` is the served model
# (default `sentence-transformers/all-MiniLM-L6-v2`); for multilingual documents use e.g. `BAAI/bge-m3` with
# `embeddings.extraArgs: [--max-batch-tokens=2048]` and about 4Gi memory (`embeddings.resources`). Without the batch
# limit, the CPU warm-up of `BAAI/bge-m3` is OOM-killed even at 6Gi. The model is downloaded on start; enable
# `embeddings.persistence.enabled` to cache it
embeddings:
  # -- Enable the Text Embeddings Inference server
  enabled: false

# -- AI features configuration (LLM-powered suggestions, RAG, and document chat)
ai:
  # -- Enable AI features (master switch)
  enabled: false
  llm:
    # -- LLM backend to use ("openai-like" or "ollama")
    backend: ""
    # -- LLM model to use (defaults to "gpt-3.5-turbo" for OpenAI-compatible or "llama3.1" for Ollama)
    model: ""
    # -- API key for the LLM backend (required for OpenAI-compatible backends)
    apiKey:
      # -- API key value (use secretKeyRef in production)
      value: ""
      # -- Reference to existing secret containing the API key
      secretKeyRef:
        # -- Name of the secret
        name: ""
        # -- Key within the secret
        key: ""
    # -- Endpoint URL for the LLM backend (required for Ollama; optional for OpenAI-compatible)
    endpoint: ""
    # -- Language for AI suggestions (defaults to user's UI language)
    outputLanguage: ""
    # -- Context size for AI prompts and RAG retrieval
    contextSize: 8192
    # -- Timeout in seconds for requests to the AI backend
    requestTimeout: 120
    # -- Allow AI endpoint URLs that resolve to private/loopback addresses. Must stay `true` when using `embeddings`
    allowInternalEndpoints: true
    # -- Extra parameters passed to the LLM backend as JSON (`PAPERLESS_AI_LLM_EXTRA_PARAMS`), e.g. `{reasoning_effort: none}`
    extraParams: {}
    embedding:
      # -- Embedding backend for RAG ("openai-like", "huggingface", or "ollama"). Instead of "huggingface", consider
      # `embeddings.enabled`: the model stays out of the paperless data volume and backups and is not reloaded on
      # every query. Must stay unset when `embeddings.enabled` is `true`
      backend: ""
      # -- Embedding model (defaults depend on backend). With `embeddings.enabled`, defaults to `embeddings.model.id`;
      # set it only to override the served-model name. Paperless rebuilds the LLM index when it changes
      model: ""
      # -- Embedding endpoint URL (defaults to LLM endpoint if not set). Must stay unset when `embeddings.enabled` is
      # `true`; the chart sets it to the embeddings server
      endpoint: ""
      # -- Chunk size when splitting document text for RAG embeddings
      chunkSize: 1024
  # -- Cron schedule for updating AI embeddings index
  indexTaskCron: "10 2 * * *"

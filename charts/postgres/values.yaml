# Default values for postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Container image configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/containers/images/)
image:
  # -- Image repository
  repository: postgres
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Overrides the chart appVersion when set
  tag: "18.4"

# -- Secrets for pulling images from a private registry. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/)
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""

# -- Override the full chart name
fullnameOverride: ""

# -- Service account configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/security/service-accounts/)
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use. If not set and `create` is `true`, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the Pod. See [Kubernetes docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/)
podAnnotations: {}

# -- Labels to add to the Pod. See [Kubernetes docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

# -- Container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Kubernetes Service configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/services-networking/service/)
service:
  # -- Service type. See [service types](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types)
  type: ClusterIP
  # -- Service port
  port: 5432

# -- Resource requests and limits for the PostgreSQL container. See [Kubernetes docs](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Liveness probe configuration. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
livenessProbe:
  exec:
    command:
      - sh
      - -c
      - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
  periodSeconds: 5

# -- Readiness probe configuration. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
readinessProbe:
  exec:
    command:
      - sh
      - -c
      - psql -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1"
  initialDelaySeconds: 5
  periodSeconds: 5

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Extra Kubernetes manifests to deploy
extraManifests: []

# -- Secret configuration for database credentials
secret:
  # -- Create a secret containing database credentials and connection details
  create: true
  # -- Name of the secret containing `username` and `password`. Auto-generated if `create` is `true`
  name: ""

# -- PostgreSQL username
username: app

# -- PostgreSQL database name
database: app

# -- PostgreSQL port
port: 5432

# -- Persistence configuration for PostgreSQL volumes
persistence:
  # -- PostgreSQL data directory persistence configuration
  pgdata:
    # -- Annotations for the PostgreSQL data PVC
    annotations: {}
    # -- Storage class for the PostgreSQL data PVC. Use `"-"` to disable dynamic provisioning
    storageClass: "-"
    # -- Size of the PostgreSQL data PVC
    size: "1Gi"
    # -- Access modes for the PostgreSQL data PVC
    accessModes:
      - ReadWriteOnce

# -- InitDB scripts to run on first startup. See [PostgreSQL Docker docs](https://github.com/docker-library/docs/blob/master/postgres/README.md#initialization-scripts)
initdb: {}
  # init.sh: |
  #   echo "Initializing database..."

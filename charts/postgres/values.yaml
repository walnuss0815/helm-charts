# Default values for postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Container image configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/containers/images/)
image:
  # -- Image repository
  repository: postgres
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- Secrets for pulling images from a private registry. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/)
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""

# -- Override the full chart name
fullnameOverride: ""

# -- Service account configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/security/service-accounts/)
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use. If not set and `create` is `true`, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the Pod. See [Kubernetes docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/)
podAnnotations: {}

# -- Labels to add to the Pod. See [Kubernetes docs](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)
podLabels: {}

# -- Pod-level security context. Runs as the image's `postgres` user (UID 999 in
# the Debian image, 70 in Alpine tags); `fsGroup` makes the data volume writable.
# On storage that ignores `fsGroup`, set this and `securityContext` to `null` to
# start as root and let the entrypoint switch users. `{}` keeps the defaults, and
# both must go because the entrypoint needs the capabilities dropped there
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. The root filesystem stays writable
# because PostgreSQL writes to `/var/run/postgresql` and `/tmp`
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Kubernetes Service configuration. See [Kubernetes docs](https://kubernetes.io/docs/concepts/services-networking/service/)
service:
  # -- Service type. See [service types](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types)
  type: ClusterIP
  # -- Service port. PostgreSQL in the container always listens on 5432. Also written to the
  # credentials Secret (`port` key and `uri`)
  port: 5432

# -- Resource requests and limits for the PostgreSQL container. The memory limit
# covers the default `shared_buffers` (128MB) plus a few connections; raise it
# for larger databases. See [Kubernetes docs](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Liveness probe configuration. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
livenessProbe:
  exec:
    command:
      - sh
      - -c
      - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
  periodSeconds: 5

# -- Readiness probe configuration. See [Kubernetes docs](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
readinessProbe:
  exec:
    command:
      - sh
      - -c
      - psql -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT 1"
  initialDelaySeconds: 5
  periodSeconds: 5

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Extra Kubernetes manifests to deploy alongside the chart. Each entry is a
# string or a map and is rendered with `tpl`
extraManifests: []

# -- Secret configuration for database credentials
secret:
  # -- Create a Secret with the connection details and a random password. The password
  # is regenerated on every render (`helm upgrade`, Argo CD sync) while PostgreSQL keeps
  # the one from its first start, so use this for CI and one-off `helm install` only.
  # For GitOps set `false` and provide the Secret via `name`
  create: true
  # -- Name of the credentials Secret (supports Helm templating). Defaults to the fullname
  # if `create` is `true`. Required if `create` is `false`; the Secret needs the keys
  # `username` and `password`, plus `host` and `port` for odoo and `host`, `port` and
  # `database` for linkwarden when used as their subchart
  name: ""

# -- PostgreSQL username
username: app

# -- PostgreSQL database name
database: app

# -- Persistence configuration for PostgreSQL volumes
persistence:
  # -- PostgreSQL data directory persistence configuration
  pgdata:
    # -- Keep the PostgreSQL data PVC when the release is uninstalled or the Argo CD
    # Application is deleted (`helm.sh/resource-policy: keep`). It holds the
    # database files. Delete it manually with `kubectl delete pvc <fullname>-pgdata`
    keep: true
    # -- Annotations for the PostgreSQL data PVC
    annotations: {}
    # -- Storage class for the PostgreSQL data PVC. Empty uses the cluster's default StorageClass; `-` sets `storageClassName: ""`, which disables dynamic provisioning
    storageClass: ""
    # -- Size of the PostgreSQL data PVC
    size: "1Gi"
    # -- Access modes for the PostgreSQL data PVC
    accessModes:
      - ReadWriteOnce

# -- InitDB scripts to run on first startup. See [PostgreSQL Docker docs](https://github.com/docker-library/docs/blob/master/postgres/README.md#initialization-scripts)
initdb: {}
  # init.sh: |
  #   echo "Initializing database..."

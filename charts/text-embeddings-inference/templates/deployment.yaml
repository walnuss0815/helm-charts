apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "text-embeddings-inference.fullname" . }}
  labels:
    {{- include "text-embeddings-inference.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # A new pod would wait for the ReadWriteOnce model cache held by the old one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "text-embeddings-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "text-embeddings-inference.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "text-embeddings-inference.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --json-output
            - --model-id
            - {{ .Values.model.id | quote }}
            {{- with .Values.model.revision }}
            - --revision
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- $env := mergeOverwrite (dict "PORT" "8080" "HF_HOME" "/data" "HUGGINGFACE_HUB_CACHE" "/data") .Values.env }}
            {{- range $key, $value := $env }}
            - name: {{ $key | quote }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
            {{- range $key, $value := .Values.envFrom }}
            - name: {{ $key | quote }}
              valueFrom:
                {{- toYaml $value | nindent 16 }}
            {{- end }}
            {{- with .Values.apiKey }}
            {{- if .secretKeyRef.name }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .secretKeyRef.name $ | quote }}
                  key: {{ tpl (required "apiKey.secretKeyRef.key is required when apiKey.secretKeyRef.name is set" .secretKeyRef.key) $ | quote }}
            {{- else if .value }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "text-embeddings-inference.fullname" $ }}
                  key: api-key
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "text-embeddings-inference.dataClaimName" . }}
          {{- else }}
          emptyDir: {{ with .Values.persistence.sizeLimit }}{sizeLimit: {{ . | quote }}}{{ else }}{}{{ end }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

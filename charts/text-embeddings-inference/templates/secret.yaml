{{- if and .Values.apiKey.value (not .Values.apiKey.secretKeyRef.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "text-embeddings-inference.fullname" . }}
  labels:
    {{- include "text-embeddings-inference.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.apiKey.value | toString | b64enc | quote }}
{{- end }}

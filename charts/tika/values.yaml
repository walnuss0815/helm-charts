# Default values for tika.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the Apache Tika deployment
# @default -- `1`
replicaCount: 1

# -- Container image configuration
image:
  # -- Container image repository
  repository: apache/tika
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's `appVersion` if not set
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the fullname of the chart
fullnameOverride: ""

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials. Apache Tika does
  # not need access to the Kubernetes API
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use (if not set and create is true, a name is generated using the fullname template)
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context. Runs as the image's non-root user `35002`. Helm
# merges maps: set a key to `null` to remove it, or the whole value to `null`
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 35002
  runAsGroup: 35002
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. The root filesystem stays writable because
# Tika and Tesseract write temporary files to `/tmp`
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 35002
  runAsGroup: 35002

# -- Service configuration
service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service port. Traffic is forwarded to container port 9998
  port: 9998

# -- Resource requests and limits for the Apache Tika container. The JVM sizes
# its heap from the memory limit; raise it for large or OCR-heavy documents.
# Set `limits` to `null` to remove the memory limit
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# -- Liveness probe configuration
livenessProbe:
  # -- HTTP GET configuration for liveness probe
  httpGet:
    path: /
    port: http

# -- Readiness probe configuration
readinessProbe:
  # -- HTTP GET configuration for readiness probe
  httpGet:
    path: /
    port: http

# -- Horizontal Pod Autoscaler configuration
autoscaling:
  # -- Enable autoscaling
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage for autoscaling
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

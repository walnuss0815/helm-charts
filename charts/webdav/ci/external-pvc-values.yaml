user:
  username:
    # -- Username value
    value: "my-user"
  password:
    # -- Password value (use secretKeyRef in production)
    value: "my-password"

persistence:
  # -- Enable persistence for WebDAV
  enabled: true
  data:
    # -- Existing PVC claim name to use (if empty, creates new PVC)
    claimName: "my-data"

# -- Extra Kubernetes manifests to deploy
extraManifests:
  - |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: "my-data"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

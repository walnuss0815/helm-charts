apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webdav.fullname" . }}
  labels:
    {{- include "webdav.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # A new pod would wait for the ReadWriteOnce data volume held by the old one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "webdav.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-cm.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "webdav.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "webdav.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          args:
            - --config
            - /config/config.yml
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: USER_USERNAME
              {{- with .Values.user.username }}
              {{- if and (contains "{env}USER_USERNAME" (toYaml $.Values.config.users)) (not (or .value (and .secretKeyRef.name .secretKeyRef.key))) }}
              {{- fail "user.username is required: set user.username.value or user.username.secretKeyRef.name and user.username.secretKeyRef.key" }}
              {{- end }}
              {{- end }}
              {{- include "webdav.secretEnvVar" .Values.user.username | indent 14 }}
            - name: USER_PASSWORD
              {{- with .Values.user.password }}
              {{- if and (contains "{env}USER_PASSWORD" (toYaml $.Values.config.users)) (not (or .value (and .secretKeyRef.name .secretKeyRef.key))) }}
              {{- fail "user.password is required: set user.password.value or user.password.secretKeyRef.name and user.password.secretKeyRef.key" }}
              {{- end }}
              {{- end }}
              {{- include "webdav.secretEnvVar" .Values.user.password | indent 14 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "webdav.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "webdav.dataPvcName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
